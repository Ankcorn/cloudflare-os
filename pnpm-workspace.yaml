packages:
  - packages/*

overrides:
  workerd: ">=1.20260623.1"
  # Pin js-yaml to the patched release (CVE-2026-53550); 4.1.1 (via @mdxeditor/editor) is vulnerable.
  js-yaml@4.1.1: ^4.2.0
  '@codemirror/commands': 6.10.3
  '@codemirror/state': 6.6.0
  '@codemirror/view': 6.43.1

minimumReleaseAgeExclude:
  - capnweb
  - capnweb-validate
  - workerd
  - "@cloudflare/workerd-*"

allowBuilds:
  core-js-pure: true
  esbuild: true
  sharp: true
  workerd: true
