packages:
  - packages/*

minimumReleaseAgeExclude:
  - capnweb
  - capnweb-validate
  # oxlint is pinned dev tooling; its platform-specific binding
  # packages are published per release and would otherwise trip the policy.
  - oxlint
  - "@oxlint/*"

allowBuilds:
  core-js-pure: true
  esbuild: true
  sharp: true
  workerd: true
