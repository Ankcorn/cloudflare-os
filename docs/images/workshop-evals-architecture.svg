<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc"><title id="title">Local Workshop agent evaluation architecture</title><desc id="desc">An eval scenario starts a local workerd Workshop, drives the production agent through AgentSession, verifies the generated Gadget over RPC, and reports raw metrics through vitest-evals.</desc><defs><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#172033" flood-opacity=".09"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#98A0AE"/></marker><style>.t{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#171A22}.h{font-size:48px;font-weight:760;letter-spacing:-1.7px}.sub{font-size:19px;fill:#656B78}.ey{font-size:13px;font-weight:750;letter-spacing:1.8px}.ct{font-size:22px;font-weight:730}.cp{font-size:15px;fill:#686E79}.own{font-size:18px;font-weight:720}.oc{font-size:14px;fill:#707683}.arrow{stroke:#A5ACB8;stroke-width:3;fill:none;marker-end:url(#a)}.card{fill:#fff;stroke:#E3E5E8;stroke-width:2;rx:18;filter:url(#s)}</style></defs><rect width="1600" height="720" fill="#F7F7F5"/><circle cx="1510" cy="20" r="170" fill="#FFF0E4"/><text class="t h" x="58" y="74">Workshop agent evals</text><text class="t sub" x="58" y="108">The Workshop stays local. Only model inference leaves workerd.</text><rect x="40" y="145" width="1520" height="360" rx="28" fill="#FFF" filter="url(#s)"/><text class="t ey" x="72" y="185" fill="#B76515">ONE TRIAL</text><text class="t sub" x="190" y="185">The same path runs on a laptop or in GitHub Actions.</text><path class="arrow" d="M286 325h45"/><path class="arrow" d="M554 325h45"/><path class="arrow" d="M822 325h45"/><path class="arrow" d="M1090 325h45"/><path class="arrow" d="M1358 325h45"/><g><rect class="card" x="62" y="242" width="224" height="166"/><rect x="62" y="242" width="224" height="7" rx="4" fill="#F59E0B"/><text class="t ey" x="84" y="278" fill="#A96312">INPUT</text><text class="t ct" x="84" y="316">Eval scenario</text><text class="t cp" x="84" y="346">Prompt + RPC checks</text><text class="t cp" x="84" y="372">Model × trial case</text></g><g><rect class="card" x="330" y="242" width="224" height="166"/><rect x="330" y="242" width="224" height="7" rx="4" fill="#3B82F6"/><text class="t ey" x="352" y="278" fill="#2D67BD">RUNTIME</text><text class="t ct" x="352" y="316">Local workerd</text><text class="t cp" x="352" y="346">Backend + Durable Objects</text><text class="t cp" x="352" y="372">Real Worker Loader</text></g><g><rect class="card" x="598" y="242" width="224" height="166"/><rect x="598" y="242" width="224" height="7" rx="4" fill="#7C3AED"/><text class="t ey" x="620" y="278" fill="#6B33C5">E2E DRIVER</text><text class="t ct" x="620" y="316">AgentSession</text><text class="t cp" x="620" y="346">Account + onboarding</text><text class="t cp" x="620" y="372">Workspace + agent turn</text></g><g><rect class="card" x="866" y="242" width="224" height="166"/><rect x="866" y="242" width="224" height="7" rx="4" fill="#EA580C"/><text class="t ey" x="888" y="278" fill="#B8470B">AGENT</text><text class="t ct" x="888" y="316">Workshop agent</text><text class="t cp" x="888" y="346">Production tools and loop</text><text class="t cp" x="888" y="372">Builds the requested app</text></g><g><rect class="card" x="1134" y="242" width="224" height="166"/><rect x="1134" y="242" width="224" height="7" rx="4" fill="#16A34A"/><text class="t ey" x="1156" y="278" fill="#15803D">RESULT</text><text class="t ct" x="1156" y="316">Generated Gadget</text><text class="t cp" x="1156" y="346">Behavior checked over RPC</text><text class="t cp" x="1156" y="372">Evidence retained per check</text></g><g><rect class="card" x="1402" y="242" width="136" height="166"/><rect x="1402" y="242" width="136" height="7" rx="4" fill="#0F766E"/><text class="t ey" x="1420" y="278" fill="#0F766E">REPORT</text><text class="t own" x="1420" y="316">vitest-</text><text class="t own" x="1420" y="340">evals</text><text class="t cp" x="1420" y="371">Scores</text><text class="t cp" x="1420" y="392">Raw metrics</text></g><rect x="40" y="535" width="1520" height="135" rx="24" fill="#FFF" stroke="#E7E8EA"/><text class="t ey" x="72" y="574" fill="#B76515">OWNERSHIP</text><circle cx="86" cy="616" r="7" fill="#3B82F6"/><text class="t own" x="104" y="622">integration-tests</text><text class="t oc" x="270" y="622">workerd, Cap’n Web, AgentSession, cleanup</text><circle cx="790" cy="616" r="7" fill="#7C3AED"/><text class="t own" x="808" y="622">workshop-evals</text><text class="t oc" x="972" y="622">prompts, checks, scoring, transcript, report</text></svg>